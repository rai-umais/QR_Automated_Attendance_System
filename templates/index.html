{% extends 'base.html' %} 

{% block title %}Home{% endblock %}

{% block content %}
<div class="landing">
    <div class="landing-bg"></div>
    <div class="landing-bg-pattern"></div>
    
    <div class="landing-center">
        <div class="hero-card">
            <div class="hero-badge">
                <div class="hero-badge-dot"></div>
                Smart Attendance
            </div>
            
            <h1 class="hero-title">FLEXiDance For <span>FLEX</span></h1>
            <p class="hero-desc">Select your role to continue to the portal</p>
            
            <div class="btn-group-landing">
                <a href="{{ url_for('auth.teacher_login') }}" class="btn-primary">
                    Login as Teacher
                </a>
                <a href="{{ url_for('auth.student_login') }}" class="btn-secondary">
                    Login as Student
                </a>
            </div>
        </div>
    </div>
</div>
    
    <!-- Global Popup Overlay for index -->
    <div id="popup-overlay" class="popup-overlay" style="display:none">
      <div class="popup-box">
        <div class="popup-icon-wrap" id="popup-icon">❌</div>
        <h3 class="popup-title" id="popup-title">Login Error</h3>
        <p class="popup-msg" id="popup-msg"></p>
        <div class="popup-actions" id="popup-actions">
            <button class="popup-btn-ok" onclick="document.getElementById('popup-overlay').style.display='none'">OK</button>
        </div>
      </div>
    </div>
</div>

{% if error %}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const overlay = document.getElementById('popup-overlay');
        const msg = document.getElementById('popup-msg');
        msg.textContent = "{{ error }}";
        overlay.style.display = 'flex';
        // Clean URL after showing popup
        window.history.replaceState({}, document.title, "/");
    });
</script>
{% endif %}
{% endblock %}
